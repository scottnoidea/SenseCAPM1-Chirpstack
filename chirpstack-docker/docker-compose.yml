services:
  chirpstack:
    image: chirpstack/chirpstack-sqlite:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack:ro
      # configure.sh creates this directory for the image's nobody user (65534).
      - ./data/chirpstack:/var/lib/chirpstack
    depends_on:
      - mosquitto
      - redis
    environment:
      MQTT_BROKER_HOST: mosquitto
      REDIS_HOST: redis
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET:?Run scripts/configure.sh first}
    ports:
      - "8080:8080"

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "127.0.0.1:1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    depends_on:
      - mosquitto

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly yes
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./configuration/mosquitto/config:/mosquitto/config:ro

volumes:
  redisdata:
