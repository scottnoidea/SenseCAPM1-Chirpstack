[logging]
level="info"

[sqlite]
path="sqlite:///var/lib/chirpstack/chirpstack.sqlite"
max_open_connections=1
pragmas=["busy_timeout = 5000", "foreign_keys = ON", "journal_mode = WAL", "synchronous = NORMAL"]

[redis]
servers=["redis://$REDIS_HOST/"]
cluster=false

[network]
net_id="000000"
enabled_regions=["au915_1"]

[api]
bind="0.0.0.0:8080"
secret="$CHIRPSTACK_API_SECRET"

[integration]
enabled=["mqtt"]

[integration.mqtt]
server="tcp://$MQTT_BROKER_HOST:1883/"
json=true
